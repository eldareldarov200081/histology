k":"10","answer":"дентин"},{"mark":"11","answer":"пульпа"},{"mark":"12","answer":"закладка постоянного зуба"},{"mark":"13","answer":"остеоклас"},{"mark":"а–е","answer":"последовательные стадии"}],"caption":"Рис.6. Развитие и прорезывание молочных зубов и закладка постоянного зуба (по А. Хэму и Д. Кормаку): а-е - последовательные стадии: 1 - закладка молочного зуба; 2 - участок мезенхимы; 3 - зубной сосочек; 4 - многослойный плоский эпителий ротовой полости; 5 - челюстно-губное выпячивание; 6 - язык; 7 - закладка нижней челюсти; 8 - эмалевый орган; 9 - эмаль; 10 - дентин; 11 - пульпа; 12 - закладка постоянного зуба; 13 - остеоклас"}]</script><script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),DATA=JSON.parse($('deck').textContent),BY_ID=new Map(DATA.map(d=>[d.id,d])),MODES=['test','flash','labels','atlas'],KEY='gista-138-v3';$('deck').remove();
const clone=x=>JSON.parse(JSON.stringify(x)),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},normalize=s=>s.toLowerCase().replaceAll('ё','е');
let state={version:3,tab:'test',config:{order:'fixed',limit:'all',semester:'all',section:'all'},sessions:{test:null,flash:null,labels:null}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('gista-138-v2')||'null');if(saved&&[2,3].includes(saved.version)&&MODES.includes(saved.tab)&&saved.config&&saved.sessions){state=saved;state.version=3;}}catch(e){}
function valid(s){return s&&Array.isArray(s.items)&&s.items.length&&s.items.every(x=>BY_ID.has(x.id)&&(x.label===null||BY_ID.get(x.id).labels[x.label]))&&Number.isInteger(s.at)&&s.at>=0&&s.at<s.items.length&&s.answers&&s.revealed&&s.options;}
for(const mode of MODES.filter(m=>m!=='atlas')){const s=state.sessions[mode];if(!valid(s)){state.sessions[mode]=null;continue;}if(!s.seen){s.seen={};for(const x of s.items)if(s.revealed[x.key]||Object.prototype.hasOwnProperty.call(s.answers,x.key))s.seen[x.key]=true;}if(mode!=='test')s.finished=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
window.addEventListener('error',e=>{$('error').hidden=false;$('error').textContent='Ошибка: '+(e.message||'не удалось открыть файл');});
function fitViewport(){if(!window.visualViewport||visualViewport.scale===1)document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||innerHeight)+'px');}
fitViewport();window.addEventListener('resize',fitViewport);window.visualViewport?.addEventListener('resize',fitViewport);
for(const name of [...new Set(DATA.map(d=>d.section))]){const o=document.createElement('option');o.value=name;o.textContent=name;$('section').append(o);}
for(const id of ['order','limit','semester','section'])$(id).value=state.config[id];
function selection(){return DATA.filter(d=>(state.config.semester==='all'||d.semester===Number(state.config.semester))&&(state.config.section==='all'||d.section===state.config.section));}
function optionsFor(card){const eligible=d=>d.id!==card.id&&d.title!==card.title&&d.family!==card.family;const candidates=[...shuffle(DATA.filter(d=>d.section===card.section&&eligible(d))),...shuffle(DATA.filter(d=>d.section!==card.section&&eligible(d)))];const options=[card.id],titles=new Set([card.title]);for(const c of candidates){if(!titles.has(c.title)){titles.add(c.title);options.push(c.id);}if(options.length===4)break;}return shuffle(options);}
function createSession(mode,explicit){let cards=selection();let items;if(explicit)items=explicit.map(x=>({...x}));else{if(mode==='labels')cards=cards.filter(c=>c.labels.length);if(state.config.order==='random')cards=shuffle(cards);if(state.config.limit!=='all')cards=cards.slice(0,Number(state.config.limit));items=mode==='labels'?cards.flatMap(c=>c.labels.map((_,label)=>({id:c.id,label,key:c.id+':'+label}))):cards.map(c=>({id:c.id,label:null,key:String(c.id)}));}if(!items.length){state.sessions[mode]=null;return;}const options={};if(mode==='test')items.forEach(item=>options[item.key]=optionsFor(BY_ID.get(item.id)));state.sessions[mode]={items,at:0,answers:{},revealed:{},seen:{},options,finished:false};}
const session=()=>state.sessions[state.tab],item=()=>session()?.items[session().at],card=()=>item()?BY_ID.get(item().id):null;
const has=(s,key)=>Object.prototype.hasOwnProperty.call(s.answers,key),missingSource=x=>x.label!==null&&!!BY_ID.get(x.id).labels[x.label].unresolved;
function correct(s,x){return has(s,x.key)&&s.answers[x.key]===x.id;}
function svgFor(c,original=false){const src=original?c.atlas:c,ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),im=document.createElementNS(ns,'image');svg.setAttribute('viewBox',`0 0 ${src.w} ${src.h}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',original?'Рисунок и подпись в оригинале':'Рисунок препарата');im.setAttribute('width',src.w);im.setAttribute('height',src.h);im.setAttribute('href',src.src);im.setAttribute('preserveAspectRatio','none');svg.append(im);return svg;}
function show(view){for(const id of ['quiz','result','atlas','empty'])$(id).hidden=id!==view;$('progress').hidden=view!=='quiz';}
function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===state.tab)));document.body.dataset.mode=state.tab;
 for(const id of ['order','limit'])$(id).disabled=state.tab==='atlas';$('start').textContent=state.tab==='atlas'?'Применить':'Начать заново';
 if(state.tab==='atlas'){renderAtlas();save();return;}if(!session())createSession(state.tab);const s=session();
 if(!s){show('empty');$('emptyNote').textContent=state.tab==='labels'?'Для этой темы в оригинале нет расшифрованных обозначений. Выбери другую тему.':'Выбери другую тему в настройках.';save();return;}
 if(state.tab==='test'&&s.finished){renderResult();save();return;}
 show('quiz');const x=item(),c=card(),done=has(s,x.key),revealed=!!s.revealed[x.key],isTest=state.tab==='test';
 const count=isTest?Object.keys(s.answers).length:Object.keys(s.seen).length;
 if(state.tab==='labels'){const ids=[...new Set(s.items.map(y=>y.id))];$('position').textContent=`Рис. ${ids.indexOf(c.id)+1}/${ids.length} · ${x.label+1}/${c.labels.length}`;$('tally').textContent=`${count}/${s.items.length}`;}
 else{$('position').textContent=`${isTest?'Вопрос':'Карточка'} ${s.at+1} из ${s.items.length}`;$('tally').textContent=isTest?`Верно ${s.items.filter(y=>correct(s,y)).length}`:`Открыто ${count}`;}
 $('progressFill').style.width=`${100*count/s.items.length}%`;$('figureButton').replaceChildren(svgFor(c));
 $('kicker').textContent=state.tab==='labels'?c.title:`${c.semester} семестр · ${c.section}`;
 $('questionTitle').textContent=isTest?'Как называется препарат?':state.tab==='flash'?'Вспомни название':'Что обозначено?';
 $('choices').hidden=!isTest;$('recall').hidden=isTest;$('reveal').hidden=isTest;$('feedback').hidden=true;
 $('prev').disabled=s.at===0;$('next').disabled=!isTest&&s.at===s.items.length-1;$('next').textContent=isTest&&s.at===s.items.length-1?'Результат →':'Вперёд →';
 if(isTest){
  $('choices').replaceChildren();s.options[x.key].forEach((id,index)=>{const b=document.createElement('button');b.className='choice';b.disabled=done;const key=document.createElement('span'),text=document.createElement('span');key.className='choice-key';key.textContent=String(index+1);text.textContent=BY_ID.get(id).title;b.append(key,text);if(done&&id===c.id){b.classList.add('correct');key.textContent='✓';}else if(done&&id===s.answers[x.key]){b.classList.add('incorrect');key.textContent='×';}b.addEventListener('click',()=>answer(id));$('choices').append(b);});
  if(done){const ok=s.answers[x.key]===c.id;$('feedback').hidden=false;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'Верно':'Верный ответ выделен зелёным';}
 }else{
  const label=state.tab==='labels'?c.labels[x.label]:null;$('labelPrompt').hidden=!label;$('labelMark').textContent=label?.mark||'';$('labelContext').textContent=label?.context||'';
  $('recallAnswer').hidden=!revealed;$('recallAnswer').className='recall-answer'+(label?.unresolved?' missing':'');$('answerText').textContent=revealed?(label?label.answer:c.title):'';
  $('reveal').textContent=revealed?'Скрыть ответ':'Показать ответ';$('reveal').setAttribute('aria-expanded',String(revealed));
 }
 $('questionPane').scrollTop=0;save();
}
function answer(id){const s=session(),x=item();if(state.tab!=='test'||!s||s.finished||has(s,x.key)||!s.options[x.key].includes(id))return;s.answers[x.key]=id;render();}
function move(delta){const s=session();if(!s)return;if(state.tab==='test'&&delta>0&&s.at===s.items.length-1)s.finished=true;else{s.at=Math.max(0,Math.min(s.items.length-1,s.at+delta));if(state.tab!=='test')s.revealed[s.items[s.at].key]=false;}render();}
function toggleAnswer(){const s=session(),x=item();if(!s||state.tab==='test'||state.tab==='atlas')return;s.revealed[x.key]=!s.revealed[x.key];if(s.revealed[x.key])s.seen[x.key]=true;render();}

function wrongItems(s){return s.items.filter(x=>has(s,x.key)&&!correct(s,x));}
function renderResult(){show('result');const s=session(),wrong=wrongItems(s),skipped=s.items.filter(x=>!has(s,x.key)),good=s.items.filter(x=>correct(s,x)).length;$('resultTitle').textContent='Результат теста';$('resultScore').textContent=`${good} / ${s.items.length}`;$('resultNote').textContent=`Верно: ${good} · ошибок: ${wrong.length} · пропущено: ${skipped.length}`;$('repeat').disabled=!wrong.length;$('repeat').textContent='Повторить ошибки';$('resume').hidden=!skipped.length;$('review').replaceChildren();for(const x of [...wrong,...skipped]){const c=BY_ID.get(x.id),b=document.createElement('button');b.textContent=c.title;b.addEventListener('click',()=>{s.at=s.items.findIndex(y=>y.key===x.key);s.finished=false;render();});$('review').append(b);}}

function renderAtlas(){show('atlas');const query=normalize($('search').value.trim()),cards=selection().filter(c=>normalize(c.title+' '+c.caption+' '+String(c.id).padStart(3,'0')).includes(query));$('atlasCount').textContent=String(cards.length)+' / '+selection().length;const list=$('atlasList');list.replaceChildren();for(const c of cards){const details=document.createElement('details');details.className='atlas-row';const summary=document.createElement('summary'),id=document.createElement('span'),name=document.createElement('span');id.className='atlas-id';id.textContent=String(c.id).padStart(3,'0');name.textContent=c.title;summary.append(id,name);details.append(summary);function load(){if(details.children.length>1)return;const button=document.createElement('button');button.className='original-button';button.setAttribute('aria-label','Увеличить рисунок с оригинальной подписью');const img=document.createElement('img');img.src=c.atlas.src;img.width=c.atlas.w;img.height=c.atlas.h;img.alt='Полный рисунок и исходная подпись';img.decoding='async';button.append(img);button.addEventListener('click',()=>zoom(c,true));details.append(button);}details.addEventListener('toggle',()=>{if(details.open){for(const other of list.querySelectorAll('details[open]'))if(other!==details)other.open=false;load();}else{for(const child of [...details.children].slice(1))child.remove();}});list.append(details);}if(!cards.length){const p=document.createElement('p');p.className='muted';p.textContent='Ничего не найдено.';list.append(p);}}
let zoomLevel=1;
function zoom(c,original=false){if(!c)return;zoomLevel=1;$('zoomCanvas').style.width='100%';$('zoomCanvas').style.height='100%';$('zoomCanvas').replaceChildren(svgFor(c,original));$('zoomLabel').textContent=original?'Рисунок и оригинальная подпись':'Рисунок';if(!$('zoomDialog').open)$('zoomDialog').showModal();$('zoomStage').scrollTop=0;$('zoomStage').scrollLeft=0;}
function zoomBy(factor){const stage=$('zoomStage'),old=zoomLevel;zoomLevel=Math.max(1,Math.min(5,zoomLevel*factor));const cx=stage.scrollLeft+stage.clientWidth/2,cy=stage.scrollTop+stage.clientHeight/2;$('zoomCanvas').style.width=100*zoomLevel+'%';$('zoomCanvas').style.height=100*zoomLevel+'%';stage.scrollLeft=cx*zoomLevel/old-stage.clientWidth/2;stage.scrollTop=cy*zoomLevel/old-stage.clientHeight/2;}
function start(){for(const id of ['order','limit','semester','section'])state.config[id]=$(id).value;$('settings').open=false;if(state.tab!=='atlas')createSession(state.tab);render();}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;$('settings').open=false;render();}));
for(const id of ['start','new'])$(id).addEventListener('click',start);
for(const id of ['order','limit','semester','section'])$(id).addEventListener('change',()=>{state.config[id]=$(id).value;if(state.tab==='atlas')renderAtlas();save();});
$('closeSettings').addEventListener('click',()=>$('settings').open=false);document.addEventListener('pointerdown',e=>{if($('settings').open&&!$('settings').contains(e.target))$('settings').open=false;});
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('reveal').addEventListener('click',toggleAnswer);$('figureButton').addEventListener('click',()=>zoom(card()));$('closeZoom').addEventListener('click',()=>$('zoomDialog').close());$('zoomIn').addEventListener('click',()=>zoomBy(1.5));$('zoomOut').addEventListener('click',()=>zoomBy(1/1.5));$('search').addEventListener('input',renderAtlas);
$('repeat').addEventListener('click',()=>{const items=wrongItems(session());if(items.length){createSession(state.tab,items);render();}});$('resume').addEventListener('click',()=>{const s=session();s.at=s.items.findIndex(x=>!has(s,x.key)&&!missingSource(x));s.finished=false;render();});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||$('zoomDialog').open||$('settings').open||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||state.tab==='atlas'||!session()||session().finished)return;const s=session(),x=item();if(e.key==='ArrowRight'){e.preventDefault();move(1);}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}else if(/^[1-4]$/.test(e.key)&&state.tab==='test'){e.preventDefault();answer(s.options[x.key][Number(e.key)-1]);}else if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();if(state.tab!=='test')toggleAnswer();else if(has(s,x.key))move(1);}});
window.HISTA={data:DATA,getState:()=>clone(state),optionsFor,createSession,render,move,toggleAnswer,answer};render();
})();
</script></body></html>
